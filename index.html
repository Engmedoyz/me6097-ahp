/* Respondent page: a short start screen, fifteen comparisons, a review list and a send step. A 3D desert scene (six criterion pillars joined by fifteen arcs, one per question) sits behind a glass panel; on phones the scene sits above the panel. */
:root{
  --bg:#EDF1F2; --glass:rgba(255,255,255,.84); --glass-2:rgba(14,34,48,.035); --line:rgba(14,34,48,.12); --line-2:rgba(14,34,48,.22);

  --c1:#13747B; --c2:#A3640B; --c3:#BC4A31; --c4:#2A66A8; --c5:#457F25; --c6:#6E4DB0;
  --sky-top:#86B6D2; --sky-hz:#F2E5D0; --sun:#FFD9A6; --terrain:#DDBA88; --slab:#CBBFAD; --halo:rgba(255,255,255,.85);
  --shadow:0 40px 90px -50px rgba(14,34,48,.55);
  --font:"Cairo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08101B; --glass:rgba(9,16,28,.76); --glass-2:rgba(255,255,255,.045); --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
  --ink:#EEF3F5; --muted:#A2B3BD; --accent:#F2B66C; --accent-ink:#1B1205; --ok:#5FC891; --warn:#F2B04E; --wa:#25D366;
  --c1:#4CC2BA; --c2:#F0C47A; --c3:#F08A6C; --c4:#78B0EE; --c5:#A8D576; --c6:#BBA0F0;
  --sky-top:#050A15; --sky-hz:#3A2B3B; --sun:#F59A57; --terrain:#8C694B; --slab:#1B2331; --halo:rgba(4,9,18,.7);
  --shadow:0 40px 90px -40px rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08101B; --glass:rgba(9,16,28,.76); --glass-2:rgba(255,255,255,.045); --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
  --ink:#EEF3F5; --muted:#A2B3BD; --accent:#F2B66C; --accent-ink:#1B1205; --ok:#5FC891; --warn:#F2B04E; --wa:#25D366;
  --c1:#4CC2BA; --c2:#F0C47A; --c3:#F08A6C; --c4:#78B0EE; --c5:#A8D576; --c6:#BBA0F0;
  --sky-top:#050A15; --sky-hz:#3A2B3B; --sun:#F59A57; --terrain:#8C694B; --slab:#1B2331; --halo:rgba(4,9,18,.7);
  --shadow:0 40px 90px -40px rgba(0,0,0,.85); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html.nogl body{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-hz) 48%,var(--terrain) 100%) fixed}
html.nogl #gl{display:none}
button,input,textarea,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;touch-action:pan-y;cursor:grab}
#gl.drag{cursor:grabbing}
.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px clamp(16px,4vw,52px) 14px}
.brand>div{min-width:0}

.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;line-height:1.25}
.brand svg{width:34px;height:34px;flex:none;color:var(--ink)}
.brand b{display:block;font-weight:800;font-size:16.5px}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:pointer;color:var(--ink)}
.icon svg{width:18px;height:18px}
.icon:hover{border-color:var(--accent)}
main{flex:1;padding:4px clamp(16px,4vw,52px) 40px}
.panel{pointer-events:auto;width:min(560px,100%);background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,2.6vw,32px);box-shadow:var(--shadow)}
@media (max-width:900px){main{padding-top:calc(36vh - 40px)}.panel{width:100%;max-width:640px;margin-inline:auto;border-radius:24px}}
.hud{position:fixed;z-index:1;bottom:20px;inset-inline-end:28px;display:flex;gap:18px;font-size:12px;font-weight:600;color:var(--muted);pointer-events:none}
@media (max-width:900px){.hud{display:none}}
.tip{position:fixed;z-index:3;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13.5px;line-height:1.4;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;box-shadow:var(--shadow)}
.tip.on{opacity:1;transform:none}
.tip b{color:var(--cc)}
.eyebrow{font-size:13px;font-weight:800;color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(28px,3.1vw,38px);line-height:1.3;font-weight:800}
h2{font-size:clamp(20px,2vw,24px);line-height:1.45;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.lead{color:var(--muted);font-size:16.5px}
.stack{display:grid;gap:18px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 13px;font-size:14px;font-weight:600;color:var(--muted);background:var(--glass-2)}
.meta svg{width:15px;height:15px}
.box{border:1px solid var(--line);border-radius:20px;padding:16px 18px;background:var(--glass-2);display:grid;gap:12px}
.lbl{font-weight:700;font-size:15px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line-2);background:transparent;border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14.5px;transition:background .2s,border-color .2s}
.pick button:hover{border-color:var(--accent)}
.pick button[aria-checked="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.need{font-size:14px;color:var(--warn);font-weight:600}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;min-height:48px;padding:8px 24px;font-weight:800;font-size:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;transition:transform .15s ease,box-shadow .2s,opacity .2s}
.cta:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px var(--accent)}
.cta[disabled]{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.cta.alt{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.cta.wa{background:var(--wa);color:#fff}
.cta.wa:hover{box-shadow:0 14px 30px -14px var(--wa)}
.cta.wide{width:100%}
.cta svg{width:19px;height:19px;flex:none}
[dir="rtl"] .cta svg.dir{transform:scaleX(-1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qhead .n{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px}
.prog i{height:6px;border-radius:9px;background:var(--line-2);transition:background .3s}
.prog i.cur{background:var(--ink)}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.cc{position:relative;border:1px solid var(--line);border-radius:18px;padding:13px 15px 14px;background:var(--glass-2);display:grid;gap:3px;align-content:start;overflow:hidden;transition:border-color .25s,background .25s,box-shadow .25s,opacity .25s}
.cc::before{content:"";position:absolute;inset-inline:14px;top:0;height:3px;border-radius:0 0 4px 4px;background:var(--cc)}
.cc .k{font-size:13px;font-weight:800;color:var(--cc)}
.cc .n{font-weight:800;font-size:16.5px;line-height:1.4}
.cc .d{color:var(--muted);font-size:13.5px;line-height:1.6}
.cc.win{border-color:color-mix(in srgb,var(--cc) 70%,transparent);background:color-mix(in srgb,var(--cc) 14%,transparent);box-shadow:0 14px 34px -20px var(--cc)}
.cc.lose{opacity:.62}
.vs{align-self:center;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);font-weight:800;font-size:13px;color:var(--muted)}
@media (max-width:560px){.duel{grid-template-columns:1fr}.vs{justify-self:center;margin-block:-4px;width:34px;height:34px}.cc .d{font-size:13px}}
.scale{display:grid;gap:10px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:18px;background:var(--glass-2)}
.meter{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;align-items:end;height:118px}
.meter button{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;display:grid;gap:6px;align-content:end;color:var(--sc);height:100%}
.meter .b{display:block;height:var(--h);border-radius:10px;background:color-mix(in srgb,var(--sc) 10%,transparent);border:1px solid color-mix(in srgb,var(--sc) 34%,transparent);transition:background .2s,transform .15s,box-shadow .25s,border-color .2s}
.meter .v{font-weight:800;font-size:15px;text-align:center;line-height:1}
.meter button:hover .b{border-color:var(--sc);transform:translateY(-2px)}
.meter button.lit .b{background:color-mix(in srgb,var(--sc) 40%,transparent)}
.meter button[aria-checked="true"] .b{background:var(--sc);border-color:var(--sc);box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 22%,transparent),0 12px 26px -10px var(--sc)}
.ends{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:13.5px;font-weight:800;color:var(--muted);line-height:1.3}
.ends span:last-child{text-align:end}
.ends .a{color:var(--ca)}.ends .bb{color:var(--cb)}
.verdict{min-height:3.1em;font-size:17px;font-weight:700;line-height:1.55;text-align:center;display:grid;place-items:center;border-radius:16px;padding:8px 12px;background:var(--glass-2);border:1px solid var(--line)}
.verdict.none{color:var(--muted);font-weight:600;font-size:15px}
.verdict .w{color:var(--cc)}
.rlist{display:grid;gap:6px;counter-reset:q}
.ri{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--glass-2);cursor:pointer;text-align:start;width:100%;transition:border-color .2s,background .2s}
.ri:hover{border-color:var(--accent)}
.ri .i{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.ri .p{font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.45}
.ri .p i{font-style:normal;font-weight:800;color:var(--cc)}
.ri .a{grid-column:2;font-size:14.5px;font-weight:700;line-height:1.45}
.ri .a i{font-style:normal;color:var(--cc)}
.ri .e{grid-row:1/span 2;grid-column:3;color:var(--muted)}
.ri .e svg{width:16px;height:16px}
.ri.flag{border-color:color-mix(in srgb,var(--warn) 70%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.ri.flag .i{color:var(--warn)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.alert svg{width:18px;height:18px;flex:none;margin-top:3px}
.check{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.check svg{width:32px;height:32px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:15px}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line-2);font-weight:800;font-size:13.5px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;word-break:break-all;background:var(--glass-2);border:1px dashed var(--line-2);border-radius:14px;padding:12px 14px;user-select:all;direction:ltr;text-align:left;color:var(--muted);max-height:7.6em;overflow:auto}
.note{font-size:14px;color:var(--muted)}
.foot{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;text-align:center;font-weight:700;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.fade{animation:fade .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:480px){.brand small{display:none}.brand b{font-size:14.5px;white-space:nowrap}.brand svg{width:28px;height:28px}.brand{gap:8px}.tools{gap:6px}.seg button{padding:3px 10px}.icon{width:34px;height:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    const az=(reduce?0:Math.sin(t*.09)*.07)+px*.16, pitch=(mode==="q"?.36:.42)-py*.05, dist=D;
    target.set(0,mode==="q"?1.9:1.6,0);
    const cp=V(target.x+Math.sin(az)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(az)*Math.cos(pitch)*dist);
    if(reduce) cam.position.copy(cp); else cam.position.lerp(cp,1-Math.pow(.05,dt));
    cam.lookAt(target); sky.position.copy(cam.position);
    renderer.render(sc,cam);
  }
  function loop(){const dt=Math.min(.05,clock.getDelta());draw(dt);requestAnimationFrame(loop);}

  theme(); layout();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",theme);
  new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  if(reduce){clock.getDelta();draw(0);} else requestAnimationFrame(loop);
  return api;
})();

/* ------------------------------------------------------------ boot */
$("#lang-en").addEventListener("click",()=>setLang("en"));
$("#lang-ar").addEventListener("click",()=>setLang("ar"));
$("#themeBtn").addEventListener("click",()=>{const nx=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",nx);store.set("ahp6-theme",nx);paintThemeBtn();});
addEventListener("keydown",e=>{
  if(S.screen!=="question"||e.target.closest("input,textarea"))return;
  const rtl=S.lang==="ar", k=S.ans[S.q];
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const d=(e.key==="ArrowRight")!==rtl?1:-1;const cur=STEPS.indexOf(k??0);S.ans[S.q]=STEPS[Math.max(0,Math.min(8,cur+d))];saveDraft();render();}
});
setLang(S.lang);
})();
</script>
